<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Velvet Scents - Checkout</title>
    <meta name="description" content="Review your selected fragrances and complete your purchase at Velvet Scents.">
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sticky Navigation -->
    <header class="nav-wrapper scrolled">
        <div class="container">
            <nav class="navbar" style="padding: 15px 0;">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="gallery.html">Shop</a>
                    <a href="about.html">About</a>
                </div>
                <a href="index.html" class="nav-logo">
                    <span class="logo-monogram">VS</span>
                    <span class="logo-text">Velvet Scents</span>
                </a>
                <div class="nav-icons">
                    <a href="#" class="icon-btn cart-icon">
                        🛍️ <span class="cart-count">0</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="serif" style="margin-bottom: 3rem;">Shopping Bag</h1>
            
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 60px;">
                <!-- Cart Items List -->
                <div class="cart-full-list">
                    <div id="cart-list-container">
                        <!-- Items injected by JS -->
                        <p style="opacity: 0.5;">Your bag is currently empty.</p>
                        <a href="gallery.html" class="btn btn-outline" style="margin-top: 2rem;">Continue Shopping</a>
                    </div>
                </div>

                <!-- Summary Section -->
                <div class="cart-summary" style="background: var(--white); padding: 40px; border-radius: 5px; height: fit-content; position: sticky; top: 100px;">
                    <h3 class="serif" style="margin-bottom: 2rem;">Order Summary</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem;">
                        <span>Subtotal</span>
                        <span class="subtotal-amount">AED 0.00</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem;">
                        <span>Shipping</span>
                        <span style="color: var(--accent-gold);">FREE</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--soft-gold); font-weight: 600; font-size: 1.2rem;">
                        <span>Total</span>
                        <span class="subtotal-amount">AED 0.00</span>
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 2rem;">Proceed to Checkout</button>
                    
                    <div style="margin-top: 2rem; font-size: 0.75rem; opacity: 0.6; text-align: center;">
                        Secure Payment Powered by Stripe & Network International
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer (Simplified) -->
    <footer class="footer" style="padding: 60px 0 30px;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Velvet Scents. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Additional logic for full cart page
        function updateFullCartUI() {
            const listContainer = document.getElementById('cart-list-container');
            if (!listContainer) return;

            if (!cart || cart.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center" style="padding: 100px 0;">
                        <p style="opacity: 0.5; font-size: 1.2rem; margin-bottom: 2rem;">Your bag is currently empty.</p>
                        <a href="gallery.html" class="btn btn-outline">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = cart.map(item => `
                <div style="display: flex; gap: 30px; padding: 30px 0; border-bottom: 1px solid var(--soft-gold); align-items: center;">
                    <img src="${item.image}" alt="${item.name}" style="width: 120px; height: 120px; object-fit: cover;">
                    <div style="flex: 1;">
                        <h3 class="serif" style="margin-bottom: 5px;">${item.name}</h3>
                        <p style="color: var(--accent-gold); font-size: 0.9rem;">Fragrance / 100ml</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 20px;">
                        <button onclick="changeQty('${item.id}', -1)" style="border: 1px solid var(--soft-gold); background: none; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;">-</button>
                        <span style="min-width: 20px; text-align: center;">${item.quantity}</span>
                        <button onclick="changeQty('${item.id}', 1)" style="border: 1px solid var(--soft-gold); background: none; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;">+</button>
                    </div>
                    <div style="width: 120px; text-align: right; font-weight: 600; font-size: 1.1rem;">
                        AED ${(item.price * item.quantity).toFixed(2)}
                    </div>
                    <button onclick="removeFromCart('${item.id}')" style="background: none; border: none; font-size: 1.5rem; opacity: 0.3; cursor: pointer; margin-left: 20px;">×</button>
                </div>
            `).join('');
        }

        // Connect full UI to global cart updates
        const baseUpdateUI = updateCartUI;
        updateCartUI = function() {
            baseUpdateUI();
            updateFullCartUI();
        };

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            updateCartUI(); // This will trigger both base and full UI
        });
    </script>
</body>
</html>
