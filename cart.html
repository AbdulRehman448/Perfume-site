<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Velvet Scents</title>
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="nav-shell scrolled">
        <div class="container navbar">
            <a href="index.html" class="nav-brand">
                <div class="vs-logo">VS</div>
                <span class="nav-wordmark">VELVET SCENTS</span>
            </a>
            <nav class="nav-center">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gallery.html" class="nav-link">Shop</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
            <div class="nav-right">
                <button class="nav-icon-btn theme-toggle-btn" onclick="cycleTheme()">🌙</button>
                <button class="nav-icon-btn lang-toggle-btn" onclick="toggleLanguage()">عربي</button>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="serif" style="margin-bottom: 3rem;">Your Shopping Bag</h1>
            
            <div style="display: flex; gap: 60px;">
                <!-- LEFT: Item List -->
                <div style="flex: 1.5;" id="cart-page-list">
                    <!-- Dynamic Cart Items -->
                </div>

                <!-- RIGHT: Summary -->
                <div style="flex: 1;">
                    <div style="background: white; border: 1px solid var(--border); padding: 40px; position: sticky; top: 120px;">
                        <h3 class="serif" style="margin-bottom: 2rem;">Order Summary</h3>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem;">
                            <span>Subtotal</span>
                            <span class="subtotal-amount">AED 0.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.9rem;">
                            <span>Shipping</span>
                            <span style="color: var(--gold);">FREE</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 1.5rem; font-weight: 600; font-size: 1.2rem;">
                            <span>Total</span>
                            <span class="subtotal-amount">AED 0.00</span>
                        </div>
                        
                        <button class="btn btn-gold" style="width: 100%; margin-top: 2rem;" onclick="handleCheckout()">CHECKOUT VIA WHATSAPP</button>
                        
                        <div style="display: flex; justify-content: center; gap: 15px; margin-top: 2rem; opacity: 0.5; font-size: 0.7rem;">
                            <span>🔒 Secure</span>
                            <span>🚚 Fast</span>
                            <span>💵 COD</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="section" style="border-top: 1px solid var(--border);">
        <div class="container">
            <h2 class="serif">You Might Also Like</h2>
            <div id="recommendations" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px;">
                <!-- Recommended Items -->
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script>
        function renderCartPage() {
            const list = document.getElementById('cart-page-list');
            if (cart.length === 0) {
                list.innerHTML = `<div style="padding: 100px 0; text-align: center;">
                    <p style="opacity: 0.5; margin-bottom: 2rem;">Your bag is empty.</p>
                    <a href="gallery.html" class="btn btn-outline">Continue Shopping</a>
                </div>`;
                return;
            }

            list.innerHTML = cart.map(item => `
                <div style="display: flex; gap: 30px; padding: 30px 0; border-bottom: 1px solid var(--border); align-items: center;">
                    <img src="${item.img}" style="width: 120px; height: 120px; object-fit: cover;">
                    <div style="flex: 1;">
                        <h3 class="serif">${item.name}</h3>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">${item.notes}</p>
                    </div>
                    <div class="cart-qty-ctrl">
                        <button onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                    <div style="width: 100px; text-align: right; font-weight: 600;">AED ${item.price * item.qty}</div>
                    <button onclick="removeFromCart(${item.id})" style="background: none; border: none; font-size: 1.5rem; opacity: 0.2; cursor: pointer;">×</button>
                </div>
            `).join('');
        }

        // Override main.js updateCartUI to also update cart page
        const baseUpdateUI = updateCartUI;
        updateCartUI = function() {
            baseUpdateUI();
            renderCartPage();
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
            
            // Render 4 random recommendations
            const recs = PRODUCTS.sort(() => 0.5 - Math.random()).slice(0, 4);
            document.getElementById('recommendations').innerHTML = recs.map(p => `
                <div class="product-card">
                    <div class="card-media"><img src="${p.img}"></div>
                    <h3 class="serif">${p.name}</h3>
                    <p class="product-price">AED ${p.price}</p>
                    <button class="btn btn-outline" style="width: 100%; padding: 0.5rem;" onclick="addToCart(${p.id})">Add to Bag</button>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
